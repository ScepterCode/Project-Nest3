<h2>Confirm your new email address</h2>
<p>Hello,</p>
<p>Tap the button to confirm {{ .NewEmail }} as the email for your ProjectNest account.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change"

    Confirm new email
